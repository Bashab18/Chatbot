services:
  - type: web
    name: chatbot-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DEVICE_SSO_SECRET
        sync: false
      - key: NODE_ENV
        value: production
    disk:
      name: rag-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
