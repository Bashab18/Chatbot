[build]
  base    = "frontend"
  publish = "build"
  command = "npm run build"

# Proxy /api/* to the Express backend on Render
# Replace YOUR_RENDER_URL with your actual Render service URL
[[redirects]]
  from   = "/api/*"
  to     = "https://YOUR_RENDER_URL/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes serve index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
